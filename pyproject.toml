[project]
name = "sh-mcp-evals"
version = "0.2.0"
description = "Evaluation of Stitched Health's MCP server: spec lint, Claude-driven cases, Trivy-style coverage report"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "anthropic>=2.4", "pyyaml>=6", "python-dotenv>=1"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
evalkit = "evalkit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["evalkit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
