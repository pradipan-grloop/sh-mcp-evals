[project]
name = "evalkit"
version = "0.1.0"
description = "Notebook-based evaluation for MCP tools"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
notebooks = ["ipykernel", "nbformat", "papermill"]
agent = ["anthropic"]
gemini = ["google-genai"]
dev = ["pytest", "pytest-asyncio", "ipykernel", "nbformat", "papermill"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["evalkit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
