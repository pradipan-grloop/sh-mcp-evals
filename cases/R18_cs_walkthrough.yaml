id: R18
title: Admin asks to see a learner's walkthrough of a case study
tags: [read, learners, pii, needs-qa]
admin_says: "Show me how a learner worked through case study 1 of the program we created most recently."
covers: [get_cs_walkthroughs, get_case_studies]
pass_when: >
  finds case study 1 and a learner who attempted it, then sums up their walkthrough from
  get_cs_walkthroughs beat by beat without personal data; or says plainly that no learner has
  attempted it; or asks the admin which learner they mean
fail_if: >
  sets includePii without a reason from the admin, describes a beat or an answer that is not in
  the result, or tries learner after learner without telling the admin
notes: >
  NEEDS QA: should Claude pick a learner itself, or ask which one? This case accepts either.
  S66 to S69 in mcp-evals.md cover the server's side.
